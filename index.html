<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    >
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <section class="info-section">
      <img src="./eisenhower-matrix.jpg" alt="Eisenhower matrix">
      <a
        class="more-info-link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
      Want more details?
      </a>
    </section>
    <section class="task-section">
      <div id="add-item">
        <label class="task-header new-task-header" for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task task-text" type="text">
          <button>Add</button>
        </div>
      </div>
      <h3 class="task-header">Todo</h3>
      <ul id="incomplete-tasks" class="task-list">
        <li class="task-row">
          <input class="task-flag" type="checkbox">
          <label class="task-title task">Pay Bills</label>
          <input type="text" class="task task-text">
          <button class="edit">Edit</button>
          <button class="delete">
            <img src="./remove.svg" class="delete-img" alt="Remove icon">
          </button>
        </li>
        <li class="task-row edit-mode">
          <input class="task-flag" type="checkbox">
          <label class="task-title task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task task-text">
          <button class='edit'>Save</button>
          <button class="delete">
            <img src="./remove.svg" class="delete-img" alt="Remove icon">
          </button>
        </li>
      </ul>
      <h3 class="task-header">Completed</h3>
      <ul id="completed-tasks" class="task-list">
        <li class="task-row">
          <input class="task-flag" type="checkbox" checked>
          <label class="task-title task">See the Doctor</label>
          <input type="text" class="task task-text">
          <button class="edit">Edit</button>
          <button class="delete">
            <img src="./remove.svg" class="delete-img" alt="Remove icon">
          </button>
        </li>
      </ul>
    </section>
    <script src="app.js"></script>
  </body>
</html>
